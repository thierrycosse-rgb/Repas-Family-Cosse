<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REPAS FAMILY COSSE</title>
<meta name="description" content="Planning des repas, liste de courses et recettes de la famille Cosse.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Socle : rendu standard, safe-areas, éléments masqués */
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: style « BD » repris de Gmail Revue. Cadres noirs épais à ombre décalée, fond crème à points rouges, onglets-boutons collants, semaine en cartes-jours. */
:root{
  color-scheme:light;
  --night:#f7f2e8; --coal:#ffffff; --steel:#d8d0c0; --ash:#57514a; --bone:#141414;
  --blood:#d0142c; --amber:#c27a00; --blue:#1f5fbf; --grey:#8a8378;
  --blood-soft:#fbe3e5; --amber-soft:#f8ecd2; --blue-soft:#e1eaf7;
  --display:"Bangers",Impact,"Arial Narrow Bold",sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--bone);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(208,20,44,.22) 1.2px,transparent 1.6px);background-size:14px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
h1,h2,h3,h4,p{text-wrap:balance}
.wrap{max-width:80rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bone);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{margin-top:20px;background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:6px 6px 0 var(--blood);
  padding:20px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.eyebrow{font-size:14px;font-weight:600;font-style:italic;margin:16px 0 0;order:2;max-width:52ch}
.top>div:first-child{display:flex;flex-direction:column}
h1{order:1;align-self:flex-start;margin:0;background:var(--blood);color:#fff;font-family:var(--display);font-weight:400;
  font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;letter-spacing:.05em;text-transform:uppercase;padding:4px 20px 0;transform:rotate(-2deg);
  border:3px solid var(--bone);box-shadow:5px 5px 0 var(--bone)}
.weeknav{display:flex;align-items:center;gap:8px;border:3px solid var(--bone);border-radius:8px;padding:10px 12px;background:var(--night)}
.weeknav .lbl{min-width:0;font-weight:700;font-size:1.05rem;padding:0 4px;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:8px;border:3px solid var(--bone);background:var(--coal);display:grid;place-items:center;
  font-size:20px;font-weight:700;line-height:1;box-shadow:2px 2px 0 var(--bone);flex:none}
.iconbtn:hover{background:var(--blood);color:#fff}

/* Onglets */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:16px 10px;background:linear-gradient(var(--night) 80%,transparent)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:3px solid var(--bone);border-radius:8px;background:var(--coal);padding:6px 14px;font-weight:700;white-space:nowrap;box-shadow:3px 3px 0 var(--bone)}
.tab:hover{background:var(--amber-soft)}
.tab[aria-selected="true"]{background:var(--bone);color:#fff}

main{padding-block:8px 48px}
.notice{font-size:13px;font-weight:600;color:var(--ash);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grey);border:2px solid var(--bone);display:inline-block}
.dot.live{background:var(--blue)} .dot.warn{background:var(--blood)}

/* Résumé */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:20px;margin-bottom:20px;
  background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:6px 6px 0 var(--bone);padding:18px 20px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:700;color:var(--ash);letter-spacing:.1em;text-transform:uppercase}
.stat .v{font-family:var(--display);font-size:2.6rem;font-weight:400;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ash);letter-spacing:0}
.meter{height:10px;border:2px solid var(--bone);border-radius:4px;background:var(--night);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.over i{background:var(--blood)}

/* Actions */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.btn{border:3px solid var(--bone);border-radius:8px;background:var(--coal);color:var(--bone);padding:6px 14px;font-weight:600;font-size:14px;
  box-shadow:3px 3px 0 var(--bone);transition:background-color .15s,color .15s}
.btn:hover:not(:disabled){background:var(--blood);color:#fff}
.btn.primary{background:var(--blood);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--bone)}
.btn.print{background:var(--amber);color:#fff}
.btn.print:hover:not(:disabled){background:var(--bone)}
.btn.warn{background:var(--bone);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.wish{flex:1 1 220px;min-width:0;border:3px solid var(--bone);background:var(--coal);border-radius:8px;padding:6px 12px}
.banner{border:2px dashed var(--bone);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:14px;background:var(--blue-soft)}
.banner.warn{background:var(--blood-soft);border-style:solid}
.banner.draft{background:var(--amber-soft)}

/* Période et type de menus */
.period{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start;justify-content:space-between;margin-bottom:20px;
  background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:6px 6px 0 var(--amber);padding:16px 20px}
.pgroup{display:flex;flex-direction:column;gap:8px;min-width:0}
.plabel{font-size:11px;font-weight:700;color:var(--ash);letter-spacing:.1em;text-transform:uppercase}
.pdates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.pdates input{border:2px solid var(--bone);border-radius:6px;padding:5px 8px;background:var(--night);font-weight:600;min-width:0}
.plen{font-family:var(--display);font-size:1.5rem;letter-spacing:.03em;color:var(--blood);margin-left:4px}
.pquick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pdates select{border:2px solid var(--bone);border-radius:6px;padding:5px 8px;background:var(--night);font-weight:700;min-width:0}
.pend{font-weight:700;color:var(--blood);margin-right:6px}
.params{background:var(--coal);border:2px dashed var(--bone);border-radius:var(--r);padding:14px 18px;margin-bottom:20px}
.params h2{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.04em;margin:0 0 8px}
.params dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
.params dt{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);padding-top:2px}
.params dd{margin:0;min-width:0}
@media (max-width:520px){.params dl{grid-template-columns:1fr;gap:0}.params dd{margin-bottom:8px}}
.seg{display:inline-flex;border:3px solid var(--bone);border-radius:8px;overflow:hidden;box-shadow:3px 3px 0 var(--bone);align-self:flex-start}
.seg button{border:0;background:var(--coal);padding:6px 14px;font-weight:700}
.seg button+button{border-left:3px solid var(--bone)}
.seg button[aria-pressed="true"]{background:var(--blood);color:#fff}
.seg button:disabled{cursor:default;opacity:.6}
.phint{font-size:13px;color:var(--ash);max-width:44ch}
.slot.bad{background:var(--blood-soft)}
.tag.warn{background:var(--coal);color:var(--blood);border-color:var(--blood)}
.tag.ok{background:var(--blue)}
.rform .check{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px}
.rform .check input{width:20px;height:20px;accent-color:var(--blood);flex:none}
.rform .check small{flex-basis:100%;font-weight:400;color:var(--ash)}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px}
.day{background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:6px 6px 0 var(--bone);overflow:hidden;display:flex;flex-direction:column;border-top-width:8px}
.day.today{box-shadow:6px 6px 0 var(--blood);border-top-color:var(--blood)}
.day-h{padding:12px 14px 8px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.day-h h3{font-family:var(--display);font-size:1.7rem;margin:0;font-weight:400;letter-spacing:.04em;line-height:1}
.day-h h3 span{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--ash);margin-left:6px;letter-spacing:0}
.pro{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;border:2px solid var(--bone);border-radius:6px;padding:1px 7px;background:var(--amber-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--blue);color:#fff}
.pbar{height:8px;border:2px solid var(--bone);border-radius:4px;background:var(--night);margin:0 14px 8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber)}
.pbar.ok i{background:var(--blue)}
.slot{display:grid;grid-template-columns:86px 1fr;gap:2px 10px;text-align:left;width:100%;border:0;border-top:2px solid var(--steel);background:none;padding:10px 14px}
.slot:hover:not(:disabled){background:var(--amber-soft)}
.slot:disabled{cursor:default}
.slot.dessert{background:var(--night);padding-block:7px}
.slot.dessert .slot-n{font-weight:600;font-size:14px}
.slot-l{grid-row:span 2;font-size:11px;font-weight:700;color:var(--ash);text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.slot-n{font-weight:700;line-height:1.3;min-width:0}
.slot-n.none{color:var(--ash);font-weight:500;font-style:italic}
.slot-m{font-size:12.5px;color:var(--ash);min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;border:2px solid var(--bone);border-radius:4px;padding:0 5px;margin-left:6px;background:var(--blood);color:#fff;vertical-align:1px}

/* Courses */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;align-items:start}
.panel{background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:6px 6px 0 var(--bone);padding:6px 0 10px;border-top:8px solid var(--blood)}
.panel h3{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.04em;margin:10px 16px 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h3 small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--blood);letter-spacing:0;font-variant-numeric:tabular-nums}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 16px;cursor:pointer;border-top:2px solid var(--steel)}
.panel h3+.item{border-top:0}
.item input{margin-top:3px;width:18px;height:18px;accent-color:var(--blood);flex:none}
.item .nm{flex:1;min-width:0;font-weight:600}
.item .qty{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .use{display:block;font-size:12px;font-weight:400;color:var(--ash)}
.item.done .nm,.item.done .qty{text-decoration:line-through;color:var(--ash)}
.pantry{font-size:14px;color:var(--ash);padding:4px 16px 8px;margin:0}
textarea.copy{width:100%;min-height:200px;margin-bottom:20px;border:3px solid var(--bone);border-radius:8px;background:var(--coal);padding:10px;font-size:13px}

/* Prépa */
.prep{max-width:760px;display:flex;flex-direction:column;gap:16px}
.prep .item{background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:4px 4px 0 var(--bone);padding:12px 14px}
.prep .item b{display:block;font-size:1.02rem}
.prep .item .nm{font-weight:400}

/* Recettes */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fchip{border:2px solid var(--bone);background:var(--coal);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.fchip[aria-pressed="true"]{background:var(--bone);color:#fff}
.search{flex:1 1 200px;min-width:0;border:3px solid var(--bone);background:var(--coal);border-radius:8px;padding:5px 12px}
.rcard{background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:4px 4px 0 var(--bone);padding:12px 14px}
.rcard h4{margin:0 0 4px;font-size:1.05rem;line-height:1.3}
.rcard .meta{font-size:12.5px;color:var(--ash);display:flex;flex-wrap:wrap;gap:4px 12px}
.rcard details{margin-top:8px;font-size:14px}
.rcard summary{cursor:pointer;color:var(--blood);font-weight:700;font-size:13px}
.rcard ul{margin:6px 0 0;padding-left:18px}
.rcard .prepnote{font-size:13px;margin-top:6px;color:var(--ash)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}
.ractions .btn{padding:3px 10px;font-size:13px;box-shadow:2px 2px 0 var(--bone)}

/* Réglages */
.form{max-width:620px;display:flex;flex-direction:column;gap:16px}
.field{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;background:var(--coal);border:3px solid var(--bone);border-radius:var(--r);box-shadow:4px 4px 0 var(--bone);padding:12px 14px}
.field label{font-weight:700}
.field small{display:block;font-weight:400;color:var(--ash);font-size:13px}
.field input[type=number]{width:100%;border:2px solid var(--bone);border-radius:6px;padding:6px 10px;background:var(--night);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--ash);max-width:68ch}

/* Feuilles (choix d'un repas, formulaire) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,20,20,.5);display:flex;align-items:flex-end;justify-content:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-p{background:var(--coal);width:100%;max-width:560px;max-height:85%;border:3px solid var(--bone);border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{align-items:center}.sheet-p{border-bottom:3px solid var(--bone);border-radius:12px;max-height:80%;box-shadow:8px 8px 0 var(--blood)}}
.sheet-h{padding:14px 16px 10px;border-bottom:3px solid var(--bone);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-h h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:1.6rem;flex:1;min-width:0;line-height:1.1}
.sheet-l{overflow-y:auto;padding:6px 0}
.opt{display:block;width:100%;text-align:left;border:0;border-top:2px solid var(--steel);background:none;padding:10px 16px}
.opt:first-child{border-top:0}
.opt:hover{background:var(--amber-soft)}
.opt.cur{background:var(--blood-soft);box-shadow:inset 6px 0 0 var(--blood)}
.opt b{display:block;font-weight:700}
.opt span{font-size:12.5px;color:var(--ash)}

/* Formulaire de recette */
.sheet-p.wide{max-width:700px}
.rform{overflow-y:auto;min-height:0;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.rform .full{grid-column:1/-1}
.rform input,.rform select,.rform textarea{border:2px solid var(--bone);border-radius:6px;padding:7px 10px;background:var(--night);font-weight:400;font-size:15px;min-width:0;width:100%}
.rform input:disabled{opacity:.4}
.rform fieldset{border:2px dashed var(--bone);border-radius:8px;padding:10px 12px 12px;margin:0;min-width:0}
.rform legend{font-weight:700;font-size:14px;padding:0 4px}
#rf-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.irow{display:grid;grid-template-columns:1fr 76px 96px 38px;gap:6px;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--steel)}
.i-new,.i-known{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ash)}
.i-new select{width:auto;flex:1 1 160px}
.i-new input{width:90px;flex:none}
.i-known{font-size:12.5px}
.ferr{margin:0;color:var(--blood);font-weight:700;font-size:14px}
.factions{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:420px){.slot{grid-template-columns:72px 1fr}.field{grid-template-columns:1fr 90px}.irow{grid-template-columns:1fr 92px 38px}.irow .i-name{grid-column:1/-1}.weeknav{width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:no-preference){.meter i,.pbar i{transition:width .3s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Cet endroit fait les meilleures chimichangas de l'île. J'aime même pas trop les chimichangas. J'adore juste le dire.</p>
      <h1>REPAS FAMILY COSSE</h1>
    </div>
    <div class="weeknav">
      <button class="iconbtn" id="prevW" aria-label="Semaine précédente">‹</button>
      <span class="lbl" id="weekLbl"></span>
      <button class="iconbtn" id="nextW" aria-label="Semaine suivante">›</button>
    </div>
  </header>
</div>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="semaine" aria-selected="true">Semaine</button>
    <button class="tab" role="tab" data-tab="courses" aria-selected="false">Courses</button>
    <button class="tab" role="tab" data-tab="prepa" aria-selected="false">Prépa dimanche</button>
    <button class="tab" role="tab" data-tab="recettes" aria-selected="false">Recettes</button>
    <button class="tab" role="tab" data-tab="reglages" aria-selected="false">Réglages</button>
  </div>
</nav>
<main class="wrap" id="main"></main>
<div class="sheet" id="sheet" hidden></div>

<script>
/* ---------- Données : prix estimés (€/kg, €/L ou €/pièce) et rayon ---------- */
const RAYONS = {F:"Fruits & légumes",V:"Boucherie & poisson",C:"Crèmerie, œufs & frais",E:"Épicerie",S:"Surgelés",B:"Boulangerie",X:"Placard"};
const RAYON_ORDER = ["F","V","C","B","E","S"];
const P = {
 "Œufs":["C",0.28],"Pain complet":["B",4],"Tomates":["F",3],"Fromage blanc 0%":["C",2.5],"Concombre":["F",0.8],
 "Jambon blanc":["C",12],"Emmental râpé":["C",9],"Avocat":["F",0.9],"Épinards surgelés":["S",2.5],"Crème fraîche légère":["C",4],
 "Wraps":["E",0.25],"Blanc de dinde (tranches)":["C",13],"Poivrons":["F",3.5],"Filet de poulet":["V",11],"Quinoa":["E",6],
 "Thon au naturel":["E",12],"Haricots verts surgelés":["S",3],"Pommes de terre":["F",1.5],"Lentilles vertes":["E",3],"Feta":["C",10],
 "Carottes":["F",1.2],"Oignons":["F",1.5],"Pavé de saumon":["V",20],"Riz parfumé (Frères Tang)":["E",3],"Sauce soja":["E",5],
 "Pois chiches (conserve)":["E",3],"Crevettes décortiquées":["S",18],"Salade verte":["F",1],"Citron":["F",0.4],"Semoule":["E",2],
 "Escalope de dinde":["V",11],"Mozzarella":["C",8],"Pesto":["E",10],"Hauts de cuisse de poulet":["V",7],"Coulis de tomate":["E",2],
 "Bœuf à braiser":["V",13],"Champignons":["F",4],"Lardons":["V",10],"Cabillaud surgelé":["S",14],"Brocoli":["F",3],
 "Bœuf haché 5%":["V",12],"Pâtes":["E",1.5],"Parmesan":["C",20],"Gnocchis":["E",3],"Courgettes":["F",2.5],
 "Nouilles de blé":["E",4],"Chou chinois":["F",3],"Lait de coco":["E",4],"Bouchées vapeur crevettes (Frères Tang)":["S",0.45],

  const drawSa=bagger(sas),drawPl=bagger(pls),drawDl=bagger(dls),drawDp=bagger(dps),out=[];
  for(let i=0;i<n;i++){
    const prevD=i>0?byId[out[i-1].d]:null,prevSa=i>0?out[i-1].sa:null;
    const on=k=>(st.portions[k]||0)>0;
    const d=on("d")?drawPl(x=>x.m==="dej"||(!!prevD&&(x.id===prevD.id||x.s===prevD.s)),x=>!!prevD&&x.id===prevD.id):null;
    const lh=on("lh")?drawPl(x=>x.m==="din"||(d&&x.id===d.id)||(prevD&&x.id===prevD.id)||(d&&x.s===d.s),x=>(d&&x.id===d.id)||(prevD&&x.id===prevD.id)):null;
    const sa=on("sa")?drawSa(x=>x.id===prevSa,()=>false):null;
    const dl=on("dl")?drawDl(x=>i>0&&x.id===out[i-1].dl,()=>false):null;
    const dp=on("dp")?drawDp(x=>i>0&&x.id===out[i-1].dp,()=>false):null;

}
function generate(seedStr,st,n){
  n=n||7;const r=rng(hash(seedStr+"|"+(st.fodmap?"sf":"af")));let best=null,bestCost=Infinity;const ok=[];const lim=budgetFor(st,n);
  for(let k=0;k<80;k++){const days=genOnce(r,st,n);const c=weekCost(days,st);if(c<=lim)ok.push(days);if(c<bestCost){best=days;bestCost=c}}
  return ok.length?ok[Math.floor(r()*ok.length)]:best;
}

function weekCost(days,st){let t=0;days.forEach(d=>SLOTS.forEach(s=>{const r=byId[d[s]];if(r)t+=r.cost*st.portions[s]}));return t}
function activeSlots(st){st=st||S.settings;return SLOTS.filter(s=>(st.portions[s]||0)>0)}
function dayProtein(d,st){st=st||S.settings;const g=s=>(st.portions[s]||0)>0?(byId[d[s]]||{p:0}).p:0;return{adult:g("sa")+g("d")+g("dl")+g("dp"),teen:g("lh")+g("d")+g("dl")+g("dp")}}
function hasAdult(st){st=st||S.settings;return st.portions.sa>0||st.portions.d>0}
function hasTeen(st){st=st||S.settings;return st.portions.lh>0||st.portions.d>0}
function shopping(days,st){
  const map=new Map(),pantry=new Set();
  days.forEach((d,i)=>SLOTS.forEach(s=>{
    const r=byId[d[s]];if(!r)return;const k=st.portions[s];if(!k)return;
    r.items.forEach(it=>{
      if(!it.u){pantry.add(it.name);return}
      const pr=priceOf(it.name);
      const e=map.get(it.name)||{name:it.name,u:it.u,q:0,uses:new Set(),r:pr?pr[0]:(it.r||"E")};
      e.q+=it.q*k;e.uses.add(r.n);map.set(it.name,e);
    });
  }));
  const groups={};
  [...map.values()].forEach(e=>{e.cost=itemCost(e.name,e.q,e.u);(groups[e.r]=groups[e.r]||[]).push(e)});
  Object.values(groups).forEach(g=>g.sort((a,b)=>a.name.localeCompare(b.name,"fr")));
  return{groups,pantry:[...pantry].sort((a,b)=>a.localeCompare(b,"fr"))};
}
function fmtQty(q,u){
  if(u==="pc"){const n=Math.ceil(q-1e-9);return n+(n>1?" pièces":" pièce")}
  if(u==="g")return q>=1000?(q/1000).toFixed(1).replace(".",",")+" kg":Math.ceil(q/10)*10+" g";
  if(u==="ml")return q>=1000?(q/1000).toFixed(1).replace(".",",")+" L":Math.ceil(q/10)*10+" ml";

}

function fitLength(w,key){

function watchWeek(){
  if(store.unsubWeek){store.unsubWeek();store.unsubWeek=null}
  const key=S.weekKey;
  if(!store.db){
    const w=LS.get(weekPath(key));
    if(w){S.week=normWeek(w);S.draft=false;if(fitLength(S.week,key))LS.set(weekPath(key),S.week)}else{S.resizeFor=null;S.week=draftWeek(key);S.draft=true}

  S.sync="loading";render();
  const timer=setTimeout(()=>{if(S.sync==="loading"){S.sync="slow";render()}},10000);
  store.unsubWeek=store.db.doc(weekPath(key)).onSnapshot(snap=>{
    if(key!==S.weekKey)return;
    if(!snap.metadata.fromCache){clearTimeout(timer);S.sync="live"}
    if(snap.exists){S.week=normWeek(snap.data());S.draft=false;if(fitLength(S.week,key))saveWeek()}
    else if(!snap.metadata.hasPendingWrites){S.resizeFor=null;S.week=draftWeek(key);S.draft=true}
    render();
  },err=>{clearTimeout(timer);S.sync="error";render()});
}
function watchSettings(){
  if(!store.db){const s=LS.get(SET_PATH);if(s)S.settings=normSettings(s);return}
  store.unsubSet=store.db.doc(SET_PATH).onSnapshot(snap=>{
    if(snap.exists){S.settings=normSettings(snap.data());if(S.draft&&S.week)S.week=draftWeek(S.weekKey);render()}

function persist(path,data){
  if(!store.db){LS.set(path,data);return Promise.resolve()}
  store.chain=store.chain.then(()=>store.db.doc(path).set(data)).catch(e=>{
    if(e&&e.code==="invalid_argument"){S.readOnly=true;S.error="Vous ne pouvez que consulter ce planning : la modification est réservée aux personnes invitées à le modifier."}
    else if(e&&e.code==="quota_exceeded"){S.error="L'espace de stockage est plein. Supprimez d'anciennes semaines pour continuer."}
    else S.error="L'enregistrement a échoué. Vérifiez la connexion puis refaites la modification.";
    render();
  });

}

main.addEventListener("click",async e=>{
  const slot=e.target.closest(".slot");
  if(slot&&!slot.disabled)return openPicker(+slot.dataset.day,slot.dataset.slot);
  const fm=e.target.closest("[data-fodmap]");if(fm&&!fm.disabled){const v=fm.dataset.fodmap==="1";if(v!==S.settings.fodmap){S.settings.fodmap=v;saveSettings();if(S.draft)S.week=draftWeek(S.weekKey);render()}return}
  const ln=e.target.closest("[data-len]");if(ln){return setPeriod(S.weekKey,+ln.dataset.len)}
  const f=e.target.closest("[data-filter]");if(f){S.filter=f.dataset.filter;S._focusQ=false;return render()}
  const ed=e.target.closest("[data-edit]");if(ed){S.recipeMsg="";return openRecipeForm(ed.dataset.edit)}
  const dl=e.target.closest("[data-del]");if(dl){S.confirmDel=dl.dataset.del;return render()}
  if(e.target.closest("[data-delno]")){S.confirmDel=null;return render()}
  const dy=e.target.closest("[data-delyes]");if(dy){const r=byId[dy.dataset.delyes];S.confirmDel=null;deleteRecipe(dy.dataset.delyes);S.recipeMsg=r?`« ${r.n} » est supprimée.`:"";return render()}
  const a=e.target.closest("[data-act]");if(!a||a.disabled)return;
  const act=a.dataset.act;
  if(act==="keep"){saveWeek();render()}
  else if(act==="gen"){if(S.draft){regen()}else{S.confirmGen=true;render()}}
  else if(act==="genYes"){S.confirmGen=false;regen()}
  else if(act==="genNo"){S.confirmGen=false;render()}
  else if(act==="newRecipe"){S.recipeMsg="";openRecipeForm(null)}
  else if(act==="uncheck"){S.week.checked={};saveWeek();render()}
  else if(act==="copy"){copyList()}
  else if(act==="pdfWeek"){printPdf("week")}
  else if(act==="pdfShop"){printPdf("shop")}
});

let pdfLibsP=null;
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("load"));document.head.appendChild(s)})}
function loadPdfLibs(){

function pdfHeader(doc,title,sub){
  const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(...INK);doc.rect(13.2,13.2,86,13,"F");
  doc.setFillColor(...RED);doc.setDrawColor(...INK);doc.setLineWidth(0.8);doc.rect(12,12,86,13,"FD");
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(255,255,255);doc.text("REPAS FAMILY COSSE",55,21,{align:"center"});
  doc.setTextColor(...INK);doc.setFontSize(15);doc.text(pt(title),W-12,21,{align:"right"});
  doc.setDrawColor(...INK);doc.setLineWidth(0.8);doc.line(12,30,W-12,30);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(...ASH);doc.text(pt(sub),12,35.5);
  return 40;
}
function pdfFooter(doc,note){
  const n=doc.getNumberOfPages(),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const when=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...ASH);
    doc.text(pt(note+" Imprimé le "+when+"."),12,H-7);doc.text(i+" / "+n,W-12,H-7,{align:"right"})}
}
function weekTitle(){return periodTitle()}
function fileDate(){const m=fromKey(S.weekKey);return pad(m.getDate())+"-"+pad(m.getMonth()+1)+"-"+m.getFullYear()}

function buildWeekPdf(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const st=S.settings,days=S.week.days,m=fromKey(S.weekKey);
  const cost=weekCost(days,st),adults=days.map(d=>dayProtein(d).adult),avg=Math.round(adults.reduce((a,b)=>a+b,0)/days.length),reached=adults.filter(a=>a>=st.goal).length;
  let y=pdfHeader(doc,weekTitle(),(st.fodmap?"Menus sans FODMAP · ":"")+"Courses estimées "+eur(cost)+" / "+eur(budgetFor(st,days.length))+(hasAdult(st)?" · protéines adulte "+avg+" g/jour en moyenne · objectif "+st.goal+" g atteint "+reached+" j/"+days.length:""));
  const cell=(id,sl)=>{const r=byId[id];if(!r)return id?"Recette introuvable":"Pas de repas";if(sl==="dl"||sl==="dp")return r.n+(r.p>=5?"\n"+r.p+" g":"");return r.n+"\n"+r.min+" min · "+r.a+" · "+r.p+" g"};
  const act=activeSlots(st),HL={sa:"Déjeuner salade",lh:"Déjeuner chaud",dl:"Dessert léger",d:"Dîner",dp:"Dessert plaisir"},showA=hasAdult(st),showT=hasTeen(st),pc=1+act.length;
  const prot=pr=>[showA?"Adulte "+pr.adult+" g":"",showT?"Ado "+pr.teen+" g":""].filter(Boolean).join("\n");
  const body=days.map((d,i)=>{const pr=dayProtein(d);return[dayName(addDays(m,i))+"\n"+fmtD(addDays(m,i))].concat(act.map(s=>cell(d[s],s)),[prot(pr)]).map(pt)});
  doc.autoTable({startY:y,head:[["Jour"].concat(act.map(s=>HL[s]),["Protéines"]).map(pt)],body,theme:"grid",
    margin:{left:12,right:12,bottom:14},
    styles:{font:"helvetica",fontSize:9,cellPadding:1.9,textColor:INK,lineColor:INK,lineWidth:0.35,valign:"middle"},
    headStyles:{fillColor:INK,textColor:[255,255,255],fontStyle:"bold",fontSize:9.5},
    alternateRowStyles:{fillColor:CREAM},
    columnStyles:Object.assign({0:{cellWidth:24,fontStyle:"bold"},[pc]:{cellWidth:24,halign:"center"}},...act.map((s2,j)=>s2==="dl"||s2==="dp"?{[j+1]:{cellWidth:32,fontSize:8}}:{})),
    didParseCell:h=>{if(h.section==="body"&&h.column.index===pc&&showA&&adults[h.row.index]>=st.goal){h.cell.styles.textColor=BLUE;h.cell.styles.fontStyle="bold"}}
  });
  // Prépa du dimanche
  const seen=new Map();days.forEach((d,i)=>SLOTS.forEach(s=>{const r=byId[d[s]];if(r&&r.prep&&st.portions[s]){const e=seen.get(r.id)||{r,days:new Set()};e.days.add(dayName(addDays(m,i)));seen.set(r.id,e)}}));
  if(seen.size){
    let py=doc.lastAutoTable.finalY+5;if(py>doc.internal.pageSize.getHeight()-40){doc.addPage();py=16}
    doc.autoTable({startY:py,head:[["","Prépa du dimanche","Pour"]],body:[...seen.values()].map(({r,days})=>["",pt(r.n+" : "+r.prep),pt([...days].join(", "))]),theme:"grid",
      margin:{left:12,right:12,bottom:14},styles:{font:"helvetica",fontSize:8.5,cellPadding:1.6,textColor:INK,lineColor:INK,lineWidth:0.35},
      headStyles:{fillColor:RED,textColor:[255,255,255],fontStyle:"bold"},columnStyles:{0:{cellWidth:8},2:{cellWidth:60}},
      didDrawCell:h=>{if(h.section==="body"&&h.column.index===0){doc.setDrawColor(...INK);doc.setLineWidth(0.4);doc.rect(h.cell.x+2,h.cell.y+h.cell.height/2-2,4,4)}}});
  }
  pdfFooter(doc,(st.fodmap?"Boisson : eau plate. ":"")+"Prix et protéines : estimations.");
  return doc;
}
function buildShopPdf(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const st=S.settings,{groups,pantry}=shopping(S.week.days,st);
  let total=0,count=0;RAYON_ORDER.forEach(k=>(groups[k]||[]).forEach(e=>{total+=e.cost;count++}));
  const y=pdfHeader(doc,"Courses Lidl",weekTitle()+" · "+count+" articles · total estimé "+eur(total)+" / "+eur(budgetFor(st,S.week.days.length)));
  // Rayons répartis sur deux colonnes, sans couper un rayon
  const blocks=RAYON_ORDER.filter(k=>groups[k]).map(k=>{const g=groups[k];const rows=[[{content:pt(RAYONS[k]+"   env. "+eur(g.reduce((t,e)=>t+e.cost,0))),colSpan:3,styles:{fillColor:RED,textColor:[255,255,255],fontStyle:"bold",fontSize:9.5}}]];
    g.forEach(e=>{const row=["",pt(e.name),pt(fmtQty(e.q,e.u))];row.item=true;row.done=!!S.week.checked[e.name];rows.push(row)});return rows});
  const totalRows=blocks.reduce((t,b)=>t+b.length,0);let acc=0;const left=[],right=[];
  blocks.forEach(b=>{(acc<totalRows/2?left:right).push(...b);acc+=b.length});
  const W=doc.internal.pageSize.getWidth(),gap=6,colW=(W-24-gap)/2;
  const opts=(body,mL)=>({startY:y,body,theme:"grid",margin:{left:mL,right:W-mL-colW,bottom:14,top:14},tableWidth:colW,
    styles:{font:"helvetica",fontSize:9,cellPadding:1.7,textColor:INK,lineColor:STEEL,lineWidth:0.3,valign:"middle"},
    columnStyles:{0:{cellWidth:8},1:{fontStyle:"bold"},2:{cellWidth:22,halign:"right"}},
    didParseCell:h=>{if(h.row.raw&&h.row.raw.done&&h.column.index>0)h.cell.styles.textColor=[150,144,135]},
    didDrawCell:h=>{if(h.column.index!==0||!(h.row.raw&&h.row.raw.item))return;
      const x=h.cell.x+2,yy=h.cell.y+h.cell.height/2-2;doc.setDrawColor(...INK);doc.setLineWidth(0.45);doc.rect(x,yy,4,4);
      if(h.row.raw.done){doc.line(x+0.8,yy+2.1,x+1.7,yy+3.2);doc.line(x+1.7,yy+3.2,x+3.4,yy+0.8)}}});
  doc.autoTable(opts(left,12));const endL=doc.lastAutoTable.finalY,pgL=doc.getNumberOfPages();
  doc.setPage(1);
  if(right.length)doc.autoTable(opts(right,12+colW+gap));
  const endR=right.length?doc.lastAutoTable.finalY:0,pgR=doc.getNumberOfPages();
  doc.setPage(Math.max(pgL,pgR));
  let yEnd=(pgL>pgR?endL:pgR>pgL?endR:Math.max(endL,endR))+6;
  if(pantry.length){
    const H=doc.internal.pageSize.getHeight();const lines=doc.splitTextToSize(pt("Placard, à vérifier : "+pantry.join(", ")),W-24);
    if(yEnd+lines.length*4.5>H-16){doc.addPage();yEnd=20}
    doc.setFont("helvetica","italic");doc.setFontSize(9);doc.setTextColor(...ASH);doc.text(lines,12,yEnd);
  }
  pdfFooter(doc,"Quantités pour les portions des réglages. Prix indicatifs. Cochés = déjà dans le chariot.");
  return doc;
}
async function printPdf(kind,btn){
  if(!dlApi||S.printing)return;
  S.printing=kind;S.error="";render();
  try{
    await loadPdfLibs();
    const doc=kind==="week"?buildWeekPdf():buildShopPdf();
    const name=(kind==="week"?"Menus du ":"Courses Lidl du ")+fileDate()+".pdf";
    await dlApi.save({filename:name,data:doc.output("blob")});
    S.printMsg="PDF prêt : ouvrez-le puis imprimez-le depuis votre lecteur PDF.";
  }catch(e){
    const c=e&&e.code;
    if(c==="declined"){}
    else if(c==="rate_limited")S.error="Une demande d'enregistrement est déjà ouverte. Répondez-y, puis réessayez.";
    else if(c==="unavailable"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){dlApi=null;S.error="L'enregistrement de fichiers n'est pas disponible dans cette vue."}
    else if(e&&e.message==="load")S.error="Le module PDF ne s'est pas chargé. Vérifiez la connexion puis réessayez.";
    else S.error="Le PDF n'a pas pu être créé. Réessayez.";
  }
  S.printing=null;render();
}

/* ---------- Démarrage ---------- */
(function boot(){
  const ls=LS.get(SET_PATH);if(ls)S.settings=normSettings(ls);
  loadLocalRecipes();watchWeek();render();
  const C=window.claude;
  if(!C||typeof C.use!=="function"){
    /* Hors Claude (site publié) : le PDF est téléchargé directement par le navigateur */
    dlApi={save:({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);return Promise.resolve()}};
    render();return;
  }
  C.use("db").then(db=>{
    if(!db)return;
    store.db=db;watchSettings();watchRecipes();watchWeek();
    C.use("user").then(u=>{if(u&&typeof u.can==="function"){Promise.resolve(u.can("data.write")).then(ok=>{if(ok===false){S.readOnly=true;render()}}).catch(()=>{})}}).catch(()=>{});
  }).catch(()=>{});
  C.use("downloads").then(d=>{if(d){dlApi=d;render()}}).catch(()=>{});
})();
</script>
